<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f1eb">
<title>Nova AI</title>
<style>
:root{--bg:#f5f1eb;--card:#fffdfa;--ink:#242321;--muted:#89847d;--line:#e8e1d8;--accent:#8a735e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;min-height:100vh;padding:26px 18px 34px;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:8px 2px 24px;border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;border-radius:14px;background:#292724;color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
.brand{font-size:20px;font-weight:700;letter-spacing:.3px}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.intro{padding:34px 2px 22px}.intro h1{font-size:clamp(28px,7vw,40px);margin:0 0 10px;letter-spacing:-1px}.intro p{color:var(--muted);line-height:1.6;margin:0}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 16px}
.mode{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 4px;color:var(--ink);font-size:13px}
.mode.active{background:#292724;color:white;border-color:#292724}
.chat{background:var(--card);border:1px solid var(--line);border-radius:20px;min-height:330px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 28px #4c3b2610}
.messages{flex:1;display:flex;flex-direction:column;gap:12px}.msg{max-width:88%;padding:12px 14px;border-radius:15px;line-height:1.55;font-size:14px;white-space:pre-wrap}.bot{background:#f0ebe4;align-self:flex-start}.user{background:#292724;color:white;align-self:flex-end}
form{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:14px}
input{min-width:0;flex:1;border:1px solid var(--line);background:white;border-radius:12px;padding:14px;font-size:15px;outline:none}
button.send{border:0;border-radius:12px;background:#292724;color:white;padding:0 18px;font-weight:600}
.note{font-size:11px;color:var(--muted);text-align:center;margin:14px 0 0}
@media(max-width:430px){.mode{font-size:12px}.chat{padding:14px}}
</style>
</head>
<body>
<main>
<header><div class="logo">N</div><div><div class="brand">Nova AI</div><div class="sub">A simple space for ideas</div></div></header>
<section class="intro"><h1>你好，今天想探索什么？</h1><p>和 Nova AI 聊天、翻译文字，或整理你的想法。</p></section>
<div class="modes">
<button class="mode active" data-mode="chat">聊天</button>
<button class="mode" data-mode="answer">问答</button>
<button class="mode" data-mode="translate">翻译</button>
<button class="mode" data-mode="write">文案</button>
</div>
<section class="chat">
<div class="messages" id="messages"><div class="msg bot">你好！我是 Nova AI 演示版。你可以输入文字，试试聊天、问答、翻译或文案功能。</div></div>
<form id="form"><input id="prompt" placeholder="输入你想问的内容…" autocomplete="off"><button class="send" type="submit">发送</button></form>
</section>
<p class="note">目前为互动演示版，回复由网页示例逻辑生成，尚未连接真实 AI 服务。</p>
</main>
<script>
const messages=document.getElementById('messages'),input=document.getElementById('prompt');
let mode='chat';
const labels={chat:'聊天',answer:'问答',translate:'翻译',write:'文案'};
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;input.placeholder=mode==='translate'?'输入需要翻译的文字…':mode==='write'?'描述你想写的文案…':'输入你想问的内容…'}));
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const q=input.value.trim();if(!q)return;add(q,'user');input.value='';let reply='这是 Nova AI 的演示回复。当前网页尚未连接真实 AI 模型。';if(mode==='translate')reply='翻译演示：请将这段文字交给已连接的翻译服务进行准确翻译。\\n\\n原文：'+q;if(mode==='answer')reply='问答演示：你问的是「'+q+'」。连接真实 AI 服务后，Nova AI 才能提供可靠答案。';if(mode==='write')reply='文案演示：\\n主题：'+q+'\\n\\n欢迎体验我们的新品！简约设计，带来不一样的灵感。\\n\\n（这是示例文案，并非真实 AI 生成。）';setTimeout(()=>add(reply,'bot'),250)});
function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;messages.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'nearest'})}
</script>
</body>
</html>
